$def with(datos)
<h1>Contactos</h1>

<a href="/insertar_contacto">Insertar Contacto</a>

<table border="1px">
    <thead>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Telefono</th>
        <th>Ver</th>
    </thead>
    <tbody>
    $for dato in datos:
        <tr>
            <td> $dato["id"] </td>
            <td> $dato["nombre"] </td>
            <td> $dato["email"]</td>
            <td> $dato["telefono"]</td>
            <td><a href="/ver_contacto/$dato['id']">Ver</a></td>
            <!--<td><a href="/actualizar_contacto/$dato['id']">Actualizar contacto</a></td>-->
            <td><a href="/borrar_contacto/$dato['id']">Borrar</a></td>
        </tr>
    </tbody>
</table>
