$def with (contacto)

$if contacto:
    <form name="contacto" method="GET">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="$contacto['nombre']" readonly><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="$contacto['email']" readonly><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" value="$contacto['telefono']" readonly><br>

        <button type="button" onclick="location.href='/contactos'">Regresar</button>
    </form>

$else:
    <h2>Contacto no encontrado</h2>
    <a href="/contactos">Regresar</a>
