$def with (contacto)

<form name="contactos" method="POST">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="$contacto['nombre']" required><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="$contacto['email']" required><br>

    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono" value="$contacto['telefono']" required><br>

    <button type="submit" name="actualizar" id="actualizar">Actualizar</button>
    <button type="button" onclick="location.href='/contactos'">Cancelar</button>
</form>
